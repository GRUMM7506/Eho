# Сборка APK и Windows-версии. Запуск: тег вида v1.0.1 (создаёт релиз с файлами)
# или вручную из вкладки Actions (файлы будут в артефактах запуска).
#
# Подпись APK берётся из секретов репозитория:
#   ANDROID_KEYSTORE_BASE64 — файл android/echo-release.jks в base64;
#   ANDROID_KEYSTORE_PASSWORD — пароль (из android/keystore.properties).
# Без секретов APK собирается с отладочной подписью (ставится, но обновлять его
# потом придётся удалением старой версии).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Ключ подписи
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/echo-release.jks
            printf 'storeFile=echo-release.jks\nstorePassword=%s\nkeyAlias=echo\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEYSTORE_PASSWORD" > android/keystore.properties
            echo "TASK=assembleRelease" >> "$GITHUB_ENV"
            echo "APK=android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            echo "TASK=assembleDebug" >> "$GITHUB_ENV"
            echo "APK=android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Gradle
        working-directory: android
        run: chmod +x gradlew && ./gradlew "$TASK" --no-daemon
      - run: |
          mkdir -p out
          cp "$APK" "out/ECHO-${GITHUB_REF_NAME//\//-}.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/*.exe

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
